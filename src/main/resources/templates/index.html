<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déduction fiscale Assistante maternelle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --background-color: #f8f9fa;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .card-body {
            padding: 2.5rem;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 1rem;
        }

        h1:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .drop-zone {
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 3rem 2rem;
            text-align: center;
            background: rgba(52, 152, 219, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 1rem 0;
        }

        .drop-zone:hover {
            background: rgba(52, 152, 219, 0.1);
            transform: translateY(-2px);
        }

        .drop-zone.dragover {
            background: rgba(52, 152, 219, 0.15);
            border-color: var(--accent-color);
        }

        .drop-zone i {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .btn-primary {
            background: var(--secondary-color);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .loading {
            display: none;
            margin-top: 2rem;
        }

        .spinner-border {
            color: var(--secondary-color);
            width: 3rem;
            height: 3rem;
        }

        .progress {
            height: 10px;
            border-radius: 5px;
            background: rgba(52, 152, 219, 0.1);
            margin-top: 1.5rem;
        }

        .progress-bar {
            background: linear-gradient(45deg, var(--secondary-color), var(--accent-color));
        }

        .result-card {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .result-card h4 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--secondary-color);
        }

        .list-group-item {
            border: none;
            margin-bottom: 0.5rem;
            border-radius: 8px !important;
            background: rgba(52, 152, 219, 0.05);
            transition: all 0.3s ease;
        }

        .list-group-item:hover {
            background: rgba(52, 152, 219, 0.1);
            transform: translateX(5px);
        }

        .badge {
            background: var(--secondary-color);
            padding: 0.5rem 1rem;
            font-weight: 500;
        }

        .error-message {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .card-body {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .drop-zone {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h1 class="text-center">Déduction fiscale Assistante maternelle</h1>
                        
                        <div class="drop-zone" id="dropZone">
                            <div class="mb-3">
                                <i class="fas fa-file-pdf"></i>
                            </div>
                            <h5>Importez votre fichier PDF</h5>
                            <p class="text-muted">ou</p>
                            <input type="file" id="fileInput" class="d-none" accept=".pdf">
                            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                                <i class="fas fa-upload me-2"></i>Choisir un fichier
                            </button>
                        </div>

                        <div class="error-message" id="errorMessage"></div>

                        <div class="loading text-center" id="loading">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3">Traitement de votre fichier...</p>
                            <div class="progress" style="display: none;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" 
                                     style="width: 0%" 
                                     id="progressBar">0%</div>
                            </div>
                        </div>

                        <div class="result-card" id="resultCard">
                            <h4 class="mb-4">Résultats</h4>
                            <div class="mb-4">
                                <strong>Fichier:</strong> <span id="fileName" class="text-primary"></span>
                            </div>
                            <div class="mb-4">
                                <strong>Montant total:</strong> 
                                <span id="totalAmount" class="h4 text-success ms-2"></span>
                            </div>
                            <div class="mb-3">
                                <strong>Montants par page:</strong>
                                <ul class="list-group mt-3" id="amountsList"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        // Highlight drop zone when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        // Handle dropped files
        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files: files } });
        }

        function handleFiles(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                uploadFile(file);
            } else {
                showError('Veuillez télécharger un fichier PDF');
            }
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            showLoading();
            hideError();
            hideResult();

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    showResult(data);
                }
            })
            .catch(error => {
                showError('Une erreur est survenue lors du traitement du fichier');
            })
            .finally(() => {
                hideLoading();
            });
        }

        function showLoading() {
            loading.style.display = 'block';
            const progressBar = document.querySelector('.progress');
            progressBar.style.display = 'block';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                if (progress > 90) {
                    clearInterval(interval);
                }
                updateProgress(progress);
            }, 500);
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${percent}%`;
            progressBar.textContent = `${percent}%`;
        }

        function hideLoading() {
            loading.style.display = 'none';
            const progressBar = document.querySelector('.progress');
            progressBar.style.display = 'none';
            updateProgress(0);
        }

        function showResult(data) {
            document.getElementById('fileName').textContent = data.fileName;
            document.getElementById('totalAmount').textContent = formatAmount(data.totalAmount);
            
            const amountsList = document.getElementById('amountsList');
            amountsList.innerHTML = '';
            data.amountsFound.forEach(({ page, amount }) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <span>Page ${page}</span>
                    <span class="badge bg-primary rounded-pill">${formatAmount(amount)}</span>
                `;
                amountsList.appendChild(li);
            });

            resultCard.style.display = 'block';
        }

        function hideResult() {
            resultCard.style.display = 'none';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function formatAmount(amount) {
            return new Intl.NumberFormat('fr-FR', {
                style: 'currency',
                currency: 'EUR'
            }).format(amount);
        }
    </script>
</body>
</html>
